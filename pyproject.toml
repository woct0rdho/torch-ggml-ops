[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-ggml-ops"
version = "0.1.0"
description = "PyTorch bindings of GGML operators"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.environment]
python-version = "3.10"
